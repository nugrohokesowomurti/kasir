<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Managenmet</title>
    <link rel="stylesheet" href="style.css"></link>
</head>
<div>
    <div class="headerStock">
        <h1>Management Stock</h1>
        <nav class="option">
        <a href="index.html">kasir</a>
        <a href="stock.html">stock</a>
        <a href="list.html">List</a>
        <a href="penjualan.html">Data Penjualan</a>
        </nav>
    </div>
<div class="mainbox">
        <div class="stockContainer">
            <h2>List Barang</h2>
            <div class="searchBox">
                <input type="text" id="cariInput" placeholder="Cari barang ...">
            </div>
            <button class="addButton" id="addButton">Tambah Barang</button>
            <button class="stockCsv" id="stockCsv">Download CSV</button>
    </div>
    <div class="stockContainer">
        </div>

    <div class="table-responsive">
        <table class="stockTable">
            <thead>
                <tr>
                    <th>No</th>
                    <th>Nama</th>
                    <th>Jumlah Barang</th>
                    <th>Jenis Barang</th>
                    <th>Harga Beli</th>
                    <th>Harga Jual</th>
                    <th>Kadaluarsa</th>
                    <th>Tanggal Masuk</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>
    </div>
</body>
<script src="script.js"></script>
</html>
