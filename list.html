<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Barang</title>
    <link rel="stylesheet" href="style.css"></link>
</head>
<div>
    <div class="headerStock">
        <h1>List Barang</h1>
    </div>
<div class="mainbox">
        <div class="stockContainer">
            <h2>List Barang</h2>
            <div class="searchBox">
                <input type="text" id="cariInput" placeholder="Cari barang ...">
    <div class="stockContainer">
        </div>
    <div class="table-responsive">
        <table class="stockTable">
            <thead>
                <tr>
                    <th>No</th>
                    <th>Nama</th>
                    <th>Jumlah Barang</th>
                    <th>Jenis Barang</th>
                    <th>Harga</th>
                    <th>Kadaluarsa</th>
                </tr>
            </thead>
            <tbody id="tableBodyList"></tbody>
        </table>
    </div>
</div>
    </div>
</body>
<script src="script.js"></script>
</html>
